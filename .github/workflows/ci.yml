name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/mitnick
      - name: Verify release packages
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        run: bash scripts/package-release.sh v0.1.0 "$RUNNER_TEMP/mitnick-dist"
